<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.35" />

  <!-- Central Shield / Geometry -->
  <path d="M256 75 L385 130 C385 270 256 390 256 390 C256 390 127 270 127 130 Z" fill="url(#shieldGrad)" filter="url(#glow)" />
  <path d="M256 88 L370 138 C370 260 256 370 256 370 C256 370 142 260 142 138 Z" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.4" />

  <!-- Bold Modern 'F' Monogram -->
  <path d="M200 170 H315 C323 170 330 177 330 185 C330 193 323 200 315 200 H235 V240 H295 C303 240 310 247 310 255 C310 263 303 270 295 270 H235 V325 C235 333 228 340 220 340 C212 340 200 333 200 325 Z" fill="#ffffff" />

  <!-- 4-Point AI Sparkle Star (Top Right) -->
  <path d="M375 140 Q375 170 405 170 Q375 170 375 200 Q375 170 345 170 Q375 170 375 140 Z" fill="url(#sparkleGrad)" filter="url(#glow)" />
  
  <!-- Mini AI Sparkle Star (Bottom Left) -->
  <path d="M150 280 Q150 298 168 298 Q150 298 150 316 Q150 298 132 298 Q150 298 150 280 Z" fill="url(#sparkleGrad)" />
</svg>
